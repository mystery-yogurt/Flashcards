name: Build for Appetize.io

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
        
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate
        
      - name: Build App for Simulator
        run: |
          xcodebuild -project Flashcards.xcodeproj \
          -scheme Flashcards \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath ./build \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          build
          
      - name: Package for Appetize (ZIP the .app)
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r FlashcardsApp.zip Flashcards.app
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appetize-App
          path: build/Build/Products/Debug-iphonesimulator/FlashcardsApp.zip
