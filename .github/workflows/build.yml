name: Build for Appetize.io

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate
        
      - name: Build App for Simulator
        run: |
          xcodebuild -project Flashcards.xcodeproj \
          -scheme Flashcards \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath ./build \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          build
          
      - name: Package for Appetize (ZIP the .app)
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          # Проверяем, что папка Flashcards.app действительно существует
          ls -l 
          # Правильно архивируем .app с помощью родной утилиты macOS (ditto)
          ditto -c -k --sequesterRsrc --keepParent Flashcards.app FlashcardsApp.zip
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appetize-App
          path: build/Build/Products/Debug-iphonesimulator/FlashcardsApp.zip
